name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Validate content
        run: node scripts/validate.mjs

      - name: Test content and terminal
        run: node --test tests/*.test.mjs

      - name: Check generated README
        run: node scripts/generate-readme.mjs --check

      - name: Check the profile README stands alone
        run: |
          test -f README.md
          test -f assets/readme/hero-dark.svg
          test -f assets/readme/hero-light.svg
          ! grep -q "github.io" README.md
