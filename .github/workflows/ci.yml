name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate content
        run: node scripts/validate.mjs

      - name: Test content and terminal
        run: node --test tests/*.test.mjs

      - name: Check generated README
        run: node scripts/generate-readme.mjs --check

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Typecheck
        working-directory: site
        run: npm run check

      - name: Check formatting
        working-directory: site
        run: npx prettier --check .

      - name: Build
        working-directory: site
        run: npm run build

      - name: Check Pages base path
        run: |
          test -f site/dist/index.html
          test -f site/dist/favicon.svg
          test -f site/dist/og-image.png
          grep -q "/alexandrerusilas/" site/dist/index.html
          grep -q 'lang="pt-BR"' site/dist/index.html
